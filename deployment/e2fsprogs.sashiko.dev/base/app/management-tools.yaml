apiVersion: v1
kind: ConfigMap
metadata:
  name: sashiko-e2fsprogs-management-scripts
  namespace: sashiko-e2fsprogs
data:
  setup-env.sh: |
    #!/bin/sh
    set -e
    echo "--- Setting up environment at $(date) ---"
    apk add --no-cache sqlite bash
    echo "--- Environment setup complete ---"
  backup-db.sh: |
    #!/bin/bash
    set -e
    DB_PATH="/data/db/sashiko-e2fsprogs.db"
    BUCKET="${BACKUP_BUCKET:-gs://BACKUP_BUCKET}"
    TIMESTAMP=$(date '+%Y-%m-%d_%Hh-%Mm-%Ss-%Z')
    TEMP_BACKUP="/data/sashiko_e2fsprogs_backup.db"

    echo "--- Starting Backup at $(date) ---"

    if [ ! -f "$DB_PATH" ]; then
        echo "Error: Database not found at $DB_PATH"
        exit 1
    fi

    echo "Cleaning remaining artifacts just in case..."
    rm -f "$TEMP_BACKUP"

    echo "Creating consistent SQLite snapshot..."
    sqlite3 "$DB_PATH" "VACUUM INTO '$TEMP_BACKUP'"

    echo "Uploading to Cloud Storage..."
    gsutil cp "$TEMP_BACKUP" \
        "${BUCKET}/sashiko_e2fsprogs_${TIMESTAMP}.db"

    echo "Cleaning up..."
    rm "$TEMP_BACKUP"

    echo "--- Backup Complete: sashiko_e2fsprogs_${TIMESTAMP}.db ---"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-manager
  namespace: sashiko-e2fsprogs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-manager
  template:
    metadata:
      labels:
        app: data-manager
    spec:
      serviceAccountName: sashiko-e2fsprogs-ksa
      nodeSelector:
        cloud.google.com/gke-nodepool: pool-256gb
      containers:
        - name: main
          image: google/cloud-sdk:alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              /usr/local/bin/setup-env.sh;
              echo "Management Service Live. Waiting for commands...";
              sleep infinity;
          volumeMounts:
            - name: sashiko-e2fsprogs-storage
              mountPath: /data
              subPath: data-dir
            - name: sashiko-e2fsprogs-storage
              mountPath: /app/third_party/e2fsprogs
              subPath: e2fsprogs-repo
            - name: scripts
              mountPath: /usr/local/bin/backup-db.sh
              subPath: backup-db.sh
            - name: scripts
              mountPath: /usr/local/bin/setup-env.sh
              subPath: setup-env.sh
      volumes:
        - name: sashiko-e2fsprogs-storage
          persistentVolumeClaim:
            claimName: sashiko-e2fsprogs-data-pvc
        - name: scripts
          configMap:
            name: sashiko-e2fsprogs-management-scripts
            defaultMode: 0755
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sashiko-e2fsprogs-nightly-backup
  namespace: sashiko-e2fsprogs
spec:
  # Staggered after sashiko.dev (03:00), sashiko-self (04:00), and
  # sashiko-gcc (05:00) so nightly backups do not contend for I/O.
  schedule: "0 6 * * *"
  timeZone: "America/Los_Angeles"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: sashiko-e2fsprogs-ksa
          nodeSelector:
            cloud.google.com/gke-nodepool: pool-256gb
          containers:
            - name: backup-worker
              image: google/cloud-sdk:alpine
              command:
                - "/bin/sh"
                - "-c"
                - >-
                  /usr/local/bin/setup-env.sh &&
                  /usr/local/bin/backup-db.sh
              volumeMounts:
                - name: sashiko-e2fsprogs-storage
                  mountPath: /data
                  subPath: data-dir
                - name: scripts
                  mountPath: /usr/local/bin/backup-db.sh
                  subPath: backup-db.sh
                - name: scripts
                  mountPath: /usr/local/bin/setup-env.sh
                  subPath: setup-env.sh
          restartPolicy: OnFailure
          volumes:
            - name: sashiko-e2fsprogs-storage
              persistentVolumeClaim:
                claimName: sashiko-e2fsprogs-data-pvc
            - name: scripts
              configMap:
                name: sashiko-e2fsprogs-management-scripts
                defaultMode: 0755
