# yamllint disable-file
apiVersion: v1
kind: ConfigMap
metadata:
  name: sashiko-e2fsprogs-maintenance-html
  namespace: sashiko-e2fsprogs
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <title>Sashiko e2fsprogs Review Maintenance</title>
        <style>
            body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                background-color: #f7f9fc;
                color: #333;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
            }
            .container {
                text-align: center;
                padding: 2.5rem;
                background: white;
                border-radius: 12px;
                box-shadow: 0 10px 25px rgba(0,0,0,0.05);
                max-width: 450px;
            }
            h1 { color: #1a73e8; margin-top: 0; font-size: 1.5rem; }
            small { color: #777; }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Sashiko is upgrading...</h1>
            <p>The e2fsprogs review instance is down for maintenance and will be back shortly.</p>
            <p><small>Thank you for your patience!</small></p>
        </div>
    </body>
    </html>
  default.conf: |
    server {
        listen 8080;
        server_name localhost;
        location = /health {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            index index.html;
            add_header Last-Modified "";
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            if_modified_since off;
            expires off;
            etag off;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sashiko-e2fsprogs-maintenance
  namespace: sashiko-e2fsprogs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sashiko-e2fsprogs-maintenance
  template:
    metadata:
      labels:
        app: sashiko-e2fsprogs-maintenance
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
        - name: config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
      volumes:
      - name: html
        configMap:
          name: sashiko-e2fsprogs-maintenance-html
      - name: config
        configMap:
          name: sashiko-e2fsprogs-maintenance-html
---
apiVersion: v1
kind: Service
metadata:
  name: sashiko-e2fsprogs-maintenance-service
  namespace: sashiko-e2fsprogs
spec:
  type: NodePort
  selector:
    app: sashiko-e2fsprogs-maintenance
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
